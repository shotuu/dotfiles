<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="WezTerm welcome banner, Rose Pine Moon theme">
  <title>shotu-dotfiles: the WezTerm welcome banner, Rose Pine Moon theme</title>
  <defs>
    <style>
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .b { font-weight: 700; }
      .i { font-style: italic; }
    </style>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1826"/>
      <stop offset="1" stop-color="#232136"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="winClip">
      <rect x="60" y="55" width="1080" height="520" rx="14" ry="14"/>
    </clipPath>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="180" cy="120" rx="220" ry="160" fill="#3e8fb0" opacity="0.16" filter="url(#glow)"/>
  <ellipse cx="1060" cy="90" rx="240" ry="170" fill="#c4a7e7" opacity="0.14" filter="url(#glow)"/>
  <ellipse cx="1000" cy="560" rx="260" ry="150" fill="#f6c177" opacity="0.10" filter="url(#glow)"/>

  <!-- window -->
  <g filter="url(#shadow)">
    <rect x="60" y="55" width="1080" height="520" rx="14" ry="14" fill="#232136" stroke="#44415a" stroke-width="1"/>
  </g>

  <g clip-path="url(#winClip)">
    <!-- chrome -->
    <rect x="60" y="55" width="1080" height="34" fill="#2a273f"/>
    <circle cx="84" cy="72" r="6" fill="#ec6a5e"/>
    <circle cx="102" cy="72" r="6" fill="#f4bf50"/>
    <circle cx="120" cy="72" r="6" fill="#61c454"/>
    <text class="mono" x="600" y="77" fill="#908caa" font-size="12" text-anchor="middle">daniel — zsh</text>

    <!-- content area -->
    <rect x="60" y="89" width="1080" height="486" fill="#232136"/>

    <!-- the welcome banner's own rounded box, inset within the window -->
    <rect x="92" y="112" width="1016" height="438" rx="16" ry="16" fill="none" stroke="#6e6a86" stroke-width="1.5"/>

    <!-- night sky: scattered stars + a crescent moon in the corner -->
    <g fill="#908caa" font-size="13" class="mono">
      <text x="130" y="140">·</text>
      <text x="180" y="150">+</text>
      <text x="240" y="134">✦</text>
      <text x="330" y="146">*</text>
      <text x="470" y="136">˙</text>
      <text x="560" y="148">·</text>
      <text x="700" y="134">+</text>
      <text x="820" y="144">·</text>
      <text x="900" y="132">*</text>
    </g>
    <g fill="#e0def4" font-size="13" class="mono">
      <text x="260" y="150">✦</text>
      <text x="650" y="140">·</text>
      <text x="760" y="150">*</text>
    </g>
    <circle cx="960" cy="150" r="16" fill="#f6c177"/>
    <circle cx="967" cy="145" r="14" fill="#232136"/>

    <!-- greeting: a stand-in for the figlet "Terrace" banner font -->
    <text class="mono b" x="128" y="222" fill="#c4a7e7" font-size="58" letter-spacing="1">good evening</text>
    <text class="mono" x="130" y="252" fill="#908caa" font-size="14" letter-spacing="3">m o n d a y ,   a u g u s t   1 7   2 0 2 6</text>

    <!-- section headers -->
    <text class="mono b" x="130" y="298" fill="#f6c177" font-size="15" text-decoration="underline">⚙ system</text>
    <text class="mono b" x="620" y="298" fill="#f6c177" font-size="15" text-decoration="underline">▤ recent directories</text>

    <!-- left column: system facts -->
    <g class="mono" font-size="13">
      <text x="130" y="326" fill="#908caa">host</text>
      <text x="230" y="326" fill="#9ccfd8">shotu-dotfiles</text>

      <text x="130" y="350" fill="#908caa">os</text>
      <text x="230" y="350" fill="#9ccfd8">macos 15.4</text>

      <text x="130" y="374" fill="#908caa">memory</text>
      <rect x="230" y="364" width="140" height="14" rx="3" fill="#44415a"/>
      <rect x="230" y="364" width="88" height="14" rx="3" fill="#9ccfd8"/>
      <text x="380" y="374" fill="#e0def4">63%</text>

      <text x="130" y="398" fill="#908caa">battery</text>
      <rect x="230" y="388" width="140" height="14" rx="3" fill="#44415a"/>
      <rect x="230" y="388" width="126" height="14" rx="3" fill="#9ccfd8"/>
      <text x="380" y="398" fill="#e0def4">90%</text>
    </g>

    <!-- left column: claude usage -->
    <text class="mono b" x="130" y="432" fill="#f6c177" font-size="15" text-decoration="underline">✳ claude usage</text>
    <g class="mono" font-size="13">
      <text x="130" y="458" fill="#908caa">5h left</text>
      <rect x="230" y="448" width="140" height="14" rx="3" fill="#44415a"/>
      <rect x="230" y="448" width="112" height="14" rx="3" fill="#9ccfd8"/>
      <text x="380" y="458" fill="#e0def4">80%</text>

      <text x="130" y="482" fill="#908caa">7d left</text>
      <rect x="230" y="472" width="140" height="14" rx="3" fill="#44415a"/>
      <rect x="230" y="472" width="122" height="14" rx="3" fill="#9ccfd8"/>
      <text x="380" y="482" fill="#e0def4">87%</text>
    </g>

    <!-- right column: recent directories, ranked bars -->
    <g class="mono" font-size="13">
      <text x="620" y="326" fill="#c4a7e7">1</text>
      <text x="640" y="326" fill="#e0def4">dotfiles</text>
      <rect x="760" y="316" width="170" height="14" rx="3" fill="#44415a"/>
      <rect x="760" y="316" width="170" height="14" rx="3" fill="#c4a7e7"/>

      <text x="620" y="350" fill="#c4a7e7">2</text>
      <text x="640" y="350" fill="#e0def4">nvim-config</text>
      <rect x="760" y="340" width="170" height="14" rx="3" fill="#44415a"/>
      <rect x="760" y="340" width="130" height="14" rx="3" fill="#c4a7e7"/>

      <text x="620" y="374" fill="#c4a7e7">3</text>
      <text x="640" y="374" fill="#e0def4">scripts</text>
      <rect x="760" y="364" width="170" height="14" rx="3" fill="#44415a"/>
      <rect x="760" y="364" width="95" height="14" rx="3" fill="#c4a7e7"/>

      <text x="620" y="398" fill="#c4a7e7">4</text>
      <text x="640" y="398" fill="#e0def4">shell</text>
      <rect x="760" y="388" width="170" height="14" rx="3" fill="#44415a"/>
      <rect x="760" y="388" width="60" height="14" rx="3" fill="#c4a7e7"/>
    </g>

    <!-- quote -->
    <text class="mono i" x="130" y="510" fill="#e0def4" font-size="14">
      <tspan fill="#f6c177">&#8220;</tspan> premature optimization is the root of all evil. <tspan fill="#f6c177">&#8221;</tspan>
      <tspan fill="#908caa" font-style="normal"> — donald knuth</tspan>
    </text>

    <!-- tip -->
    <text class="mono" x="130" y="536" fill="#c4a7e7" font-size="13">tip</text>
    <text class="mono" x="182" y="536" fill="#908caa" font-size="13">ctrl-space then h/j/k/l  moves between panes</text>

    <!-- bottom stars -->
    <g fill="#908caa" font-size="13" class="mono">
      <text x="860" y="480">.</text>
      <text x="900" y="510">·</text>
      <text x="950" y="530">+</text>
      <text x="1000" y="500">*</text>
    </g>
  </g>
</svg>
