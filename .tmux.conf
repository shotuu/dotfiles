# Kun-style tmux layout with a compact top status bar.
set -g status-position top
set -g status-interval 1
set -g status-justify left
set -g status-style "bg=#393552,fg=#e0def4"
set -g status-left-length 30
set -g status-right-length 80

# Session name on the left.
set -g status-left "#[fg=#232136,bg=#f6c177,bold] 󰆍 #S #[default] "

# Window tabs.
setw -g window-status-format "#[fg=#908caa,bg=#393552] #I: #W "
setw -g window-status-current-format "#[fg=#232136,bg=#f6c177,bold] #I: #W "
setw -g window-status-separator ""

# Username, date, and live time including seconds.
set -g status-right "#[fg=#c4a7e7,bold] #(whoami) #[fg=#6e6a86] • #[fg=#9ccfd8,bold] %Y-%m-%d  %H:%M:%S "

# Pane borders remain below the tmux status bar, fixing the line-through-bar effect.
set -g pane-border-style "fg=#44415a"
set -g pane-active-border-style "fg=#f6c177"
set -g pane-border-status off

# General usability.
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g mode-keys vi

# Prefix: Ctrl-a instead of Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits inherit the current directory.
unbind %
unbind '"'
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + Shift-H/J/K/L.
bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

# Reload config.
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded"

# Create windows in the current directory.
bind c new-window -c "#{pane_current_path}"
